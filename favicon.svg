<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
    <defs>
        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#D4AF37" />
            <stop offset="50%" stop-color="#FFD700" />
            <stop offset="100%" stop-color="#B8860B" />
        </linearGradient>
        <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#2C2C2C" />
            <stop offset="100%" stop-color="#141414" />
        </radialGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="6" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="14" />
    <circle cx="256" cy="256" r="216" fill="none" stroke="rgba(212, 175, 55, 0.35)" stroke-width="3" stroke-dasharray="10 8" />
    <text x="256" y="315" font-family="'Cormorant Garamond', 'Georgia', serif" font-size="200" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="-2" filter="url(#glow)">C<tspan fill="#FFFFFF">.</tspan>A</text>
</svg>
